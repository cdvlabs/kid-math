<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toán Tiểu Học</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🧮 Bé Luyện Toán</h2>
        
        <!-- CẤU HÌNH -->
        <div class="settings" id="settingsPanel">
            <div class="form-group">
                <label>Phạm vi số:</label>
                <div class="range-box">
                    <input type="number" id="minVal" value="1">
                    <span>đến</span>
                    <input type="number" id="maxVal" value="10">
                </div>
            </div>

            <div class="form-group">
                <label>Phép tính:</label>
                <div class="checks">
                    <!-- Mặc định checked Cộng/Trừ theo ý bạn -->
                    <label><input type="checkbox" id="add" checked> Cộng (+)</label>
                    <label><input type="checkbox" id="sub" checked> Trừ (-)</label>
                    <label><input type="checkbox" id="mul"> Nhân (×)</label>
                    <label><input type="checkbox" id="div"> Chia (÷)</label>
                </div>
            </div>
            <button class="btn-primary" onclick="startGame()">Bắt đầu làm bài</button>
        </div>

        <!-- MÀN HÌNH CHƠI -->
        <div class="game" id="gamePanel" style="display:none;">
            <div class="stats">
                <span>Đúng: <b id="score" style="color:green">0</b></span>
            </div>

            <div class="question">
                <span id="qText">1 + 1 = ?</span>
            </div>

            <input type="number" id="userAns" placeholder="..." onkeydown="if(event.key==='Enter') check()">
            
            <div class="msg" id="msg"></div>

            <div class="actions">
                <button class="btn-check" onclick="check()">Kiểm tra</button>
                <button class="btn-sec" onclick="location.reload()">⚙ Cài đặt lại</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
