<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bé Học Toán - CDV Labs</title>
    
    <!-- Dòng này là điểm mấu chốt: Load theme Minty từ Bootswatch -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/minty/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <!-- Card dùng class của Minty -->
                <div class="card border-primary shadow-sm rounded-4">
                    <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                        <h1 class="h2 mb-0">✨ Bé Luyện Toán ✨</h1>
                    </div>
                    
                    <div class="card-body p-4">
                        <!-- CẤU HÌNH -->
                        <div id="settingsPanel">
                            <h4 class="text-primary mb-4 text-center">⚙️ Cài đặt bài tập</h4>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">Phạm vi số:</label>
                                <div class="input-group">
                                    <input type="number" id="minVal" class="form-control form-control-lg text-center" value="1">
                                    <span class="input-group-text bg-light">đến</span>
                                    <input type="number" id="maxVal" class="form-control form-control-lg text-center" value="10">
                                </div>
                            </div>

                            <div class="mb-5">
                                <label class="form-label fw-bold">Phép tính:</label>
                                <div class="row g-3">
                                    <div class="col-6">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="add" checked>
                                            <label class="form-check-label" for="add">Cộng (+)</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="sub" checked>
                                            <label class="form-check-label" for="sub">Trừ (-)</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="mul">
                                            <label class="form-check-label" for="mul">Nhân (×)</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="div">
                                            <label class="form-check-label" for="div">Chia (÷)</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <button class="btn btn-secondary btn-lg w-100 rounded-pill shadow" onclick="startGame()">
                                Bắt đầu học ngay 🚀
                            </button>
                        </div>

                        <!-- MÀN HÌNH CHƠI -->
                        <div id="gamePanel" style="display:none;">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="badge bg-info p-2 px-3 rounded-pill fs-6">
                                    Điểm: <span id="score">0</span>
                                </div>
                                <button class="btn btn-sm btn-outline-warning rounded-pill" onclick="location.reload()">
                                    🔙 Quay lại
                                </button>
                            </div>

                            <div class="text-center py-4">
                                <div class="display-1 fw-bold text-dark mb-4" id="qText" style="font-family: 'Comic Sans MS', cursive;">
                                    1 + 1 = ?
                                </div>
                                
                                <div class="input-group input-group-lg mb-4 mx-auto" style="max-width: 180px;">
                                    <input type="number" id="userAns" class="form-control text-center border-primary border-3 rounded-3" 
                                           placeholder="?" onkeydown="if(event.key==='Enter') check()">
                                </div>
                                
                                <div id="msg" class="fs-4 fw-bold mb-4" style="height: 45px;"></div>
                                
                                <button class="btn btn-primary btn-lg px-5 rounded-pill shadow-sm" onclick="check()">
                                    Kiểm tra ✔
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">Dự án giáo dục bởi <strong>CDV Labs</strong></p>
                    <p class="text-muted small">Mã nguồn mở - MIT License</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
